services:
  api:
    build: .
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qpset
      POSTGRES_PASSWORD: qpset
      POSTGRES_DB: qpset
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qpset -d qpset"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
